name: Publish Package

on:
  push:
    branches: ["master"]

permissions:
  id-token: write  # Required for OIDC
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      - run: npm ci
      - run: npm run build --if-present
      - run: npm test

      # Every push to master runs this workflow, but only version bumps are
      # releases. Without this guard, dependency merges fail with
      # "cannot publish over the previously published versions".
      - name: Publish if version is new
        run: |
          V=$(node -p "require('./package.json').version")
          N=$(node -p "require('./package.json').name")
          if npm view "$N@$V" version >/dev/null 2>&1; then
            echo "$N@$V already published - skipping"
          else
            npm publish
          fi
