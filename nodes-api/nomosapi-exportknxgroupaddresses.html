<script data-help-name="nomosapi-exportknxgroupaddresses" type="text/x-red">
    <p>The service node represents <strong>exportKNXGroupAddresses</strong> nomos system API Function: <br>
        Export the KNX group addresses created on the controller -- and, on request, those of the imported projects -- with main and middle groups, names and datapoint types, as a file the ETS imports as group addresses.<br>(Version 0.3.40 | <span class="pill-o">admin</span> User Permission needed)
    </p>
    <ul>
        <li><strong>nomos Controller</strong>: The nomos system Controller connected to</li>
        <li><strong>Name</strong>: <em>optional</em> Name</li>
        <li><strong>Topic</strong>: An <em>optional</em> property that can be configured in the node or, if left blank, can be set by <code>msg.topic</code>. If <em>Filter on Topic</em> is selected <code>msg.topic</code> of incoming messages must match the configured
            value for the message to be accepted. If <em>Filter on Topic</em> is selected and no <em>Topic</em> is set on the node, then <code>msg.topic</code> must match the nodes <em>Name</em></li>
    </ul>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">object</span></dt><dd>The payload object</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.format <span class="property-type">string</span></dt><dd><em>(optional)</em> xml (default): the ETS group address export, UTF-8. csv: the ETS three-level layout in the Windows character set, as the ETS reads it; characters outside it are replaced.<br>Allowed values: <code>xml</code> <code>csv</code> </dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.includeProjects <span class="property-type">boolean</span></dt><dd><em>(optional)</em> Default false: only the group addresses created on the controller -- by hand or by commissioning -- which an ETS project that the imported projects came from does not have yet. true adds the addresses of the imported projects, with any names and datapoint types changed on the controller. Main and middle groups carry the projects' names either way.</dd></dl>

    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
         <li>API result
             <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">object</span></dt><dd>The payload object</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.fileName <span class="property-type">string</span></dt><dd>Suggested file name.</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.mimeType <span class="property-type">string</span></dt><dd>application/xml or text/csv.</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.count <span class="property-type">number</span></dt><dd>Number of group addresses in the file.</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.data <span class="property-type">string</span></dt><dd>The file, base64 encoded.</dd></dl>

         </li>
         <li>API error
             <dl class="message-properties">
                 <dt>payload <span class="property-type">object</span></dt>
                 <dd>
                    <dt>payload.errorCode <span class="property-type">integer</span></dt>
                    <dd>Error Code</dd>
                    <dt>payload.errorText <span class="property-type">string</span></dt>
                    <dd>Error Message Text</dd>
                 </dd>
             </dl>
         </li>
    </ol>
