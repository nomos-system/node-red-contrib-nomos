<script data-help-name="nomosapi-updatevehiclechargingprofile" type="text/x-red">
    <p>The service node represents <strong>updateVehicleChargingProfile</strong> nomos system API Function: <br>
        Writes one charging profile back to the car. Read it with getVehicleChargingProfiles first and send the complete profile with the changed fields applied; the car confirms the change only in a later update (the vehicle component's pending_command property shows "charging_profile_update" until then). Counts against the car brand's request quota.<br>(Version 0.3.40 | <span class="pill-o">admin</span> User Permission needed)
    </p>
    <ul>
        <li><strong>nomos Controller</strong>: The nomos system Controller connected to</li>
        <li><strong>Name</strong>: <em>optional</em> Name</li>
        <li><strong>Topic</strong>: An <em>optional</em> property that can be configured in the node or, if left blank, can be set by <code>msg.topic</code>. If <em>Filter on Topic</em> is selected <code>msg.topic</code> of incoming messages must match the configured
            value for the message to be accepted. If <em>Filter on Topic</em> is selected and no <em>Topic</em> is set on the node, then <code>msg.topic</code> must match the nodes <em>Name</em></li>
    </ul>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">object</span></dt><dd>The payload object</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.cid <span class="property-type">string</span></dt><dd>Component ID of the vehicle</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.id <span class="property-type">number</span></dt><dd>Profile id, from getVehicleChargingProfiles. An id the car does not know fails with `invalid_request`.</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.profile <span class="property-type">object</span></dt><dd>The complete profile as returned by getVehicleChargingProfiles, with the changed fields applied. Its `id`, if present, must equal `id`. A one-off timer needs a weekday in `oneOffDay` and no `recurringOn` days; weekdays are "MONDAY" to "SUNDAY". Otherwise the call fails with `invalid_request` and nothing is sent to the car.</dd></dl>

    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
         <li>API result
             <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">boolean</span></dt><dd></dd></dl>

         </li>

                    <dt>payload.errorCode <span class="property-type">integer</span></dt>

                    <dt>payload.errorText <span class="property-type">string</span></dt>

                 </dd>
             </dl>
