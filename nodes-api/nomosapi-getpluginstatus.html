<script data-help-name="nomosapi-getpluginstatus" type="text/x-red">
    <p>The service node represents <strong>getPluginStatus</strong> nomos system API Function: <br>
        Get what a plugin is doing right now, e.g. which motion lighting instance has its lights on and for how long still. Clients showing it refetch on onPluginStatusChange.<br>(Version 0.3.40 | <span class="pill-o">admin</span> User Permission needed)
    </p>
    <ul>
        <li><strong>nomos Controller</strong>: The nomos system Controller connected to</li>
        <li><strong>Name</strong>: <em>optional</em> Name</li>
        <li><strong>Topic</strong>: An <em>optional</em> property that can be configured in the node or, if left blank, can be set by <code>msg.topic</code>. If <em>Filter on Topic</em> is selected <code>msg.topic</code> of incoming messages must match the configured
            value for the message to be accepted. If <em>Filter on Topic</em> is selected and no <em>Topic</em> is set on the node, then <code>msg.topic</code> must match the nodes <em>Name</em></li>
    </ul>

    <h3>Inputs</h3>
    <dl class="message-properties">
        <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">object</span></dt><dd>The payload object</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.id <span class="property-type">string</span></dt><dd>Plugin ID</dd></dl>

    </dl>

    <h3>Outputs</h3>
    <ol class="node-ports">
         <li>API result
             <dl class="message-properties" style="border: none;"><dt>payload <span class="property-type">object</span></dt><dd>The payload object</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.id <span class="property-type">string</span></dt><dd>Plugin ID</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.running <span class="property-type">boolean</span></dt><dd>Whether the plugin is currently running</dd></dl>
<dl class="message-properties" style="border: none;"><dt>payload.status <span class="property-type">object | null</span></dt><dd>What the plugin is doing right now. Which fields exist is defined by the plugin itself; null when the plugin is not running or reports no live status. Motion lighting reports `instances`, keyed by instance ID, each with `state` (`idle`, `on` or `prewarn`), `remainingMs` (time until the lights switch off or the prewarning starts, null while motion is still reported or "permanently on" holds the lights), `lockedMs` (remaining lockout after a manual switch-off, or null), `motion`, `enabled` and `permanent`. Vacation mode reports `state`, `planned`, `manual` and `simulation`: `enabled`, `running` (switching only happens while vacation mode is on), `day`, today's `entries` per selected device (`cid`, `on` and `off` as HH:MM on the controller's clock, `lit` when the simulation switched it on) and `next` (the next switching today: `cid`, `state`, `at`, `inMs`), or null when nothing is left today. Places reports `zones` and `sources`. `zones` lists home first, then the configured places, each with `id`, `cid` (its component), `name`, `lat`/`lng` of the centre (null for home while the controller has no location), `radius` in metres and `members`: the devices inside, each with `cid`, `name` and `since`. `sources` lists every device with a position: `cid`, `name`, `tracked` (false when excluded in the settings), `zone` (the place it is in, or null), `positionAge` (seconds since the last valid position received since the plugin started, or null), `stale` (the last report carried no valid position) and, for tracked devices with a known position, `lat`/`lng`.</dd></dl>

         </li>
         <li>API error
             <dl class="message-properties">
                 <dt>payload <span class="property-type">object</span></dt>
                 <dd>
                    <dt>payload.errorCode <span class="property-type">integer</span></dt>
                    <dd>Error Code</dd>
                    <dt>payload.errorText <span class="property-type">string</span></dt>
                    <dd>Error Message Text</dd>
                 </dd>
             </dl>
         </li>
    </ol>

    </ul>

</script>
